# x264 + opus in matroska, judged by ffprobe and mkvalidator
id = "h264-mkv-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "mkv"
video = "h264"
audio = "opus"
validators = ["ffprobe", "mkvalidator"]
