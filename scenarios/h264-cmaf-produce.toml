# x264 in a CMAF video track file, MP4Box checks the cmfc brand, WebCodecs decodes it
id = "h264-cmaf-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "cmaf"
video = "h264"
validators = ["ffprobe", "mp4box", "player"]
