id = "opus-chained-determinism"
engines = ["g2g"]
reference = "g2g"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/chained-mono-48k.opus"

# chained ogg: two logical opus streams back to back, so a decoder that stops at
# the first end-of-stream page emits half the pcm. exercises g2g's chain-boundary
# decoder rebuild. self-comparison only: gstreamer's static decodebin does not
# follow the chain (not-linked on the second serial), and ffmpeg n8.x's libopus
# wrapper is not bit-exact against the integer api (see opus-decode-diff).
[audio]
codec = "opus"
rate = 48000
channels = 1

[determinism]
runs = 3
