# x264 + opus in mpeg-ts, ffmpeg muxes it as a registered private stream
id = "h264-ts-opus-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "ts"
video = "h264"
audio = "opus"
validators = ["ffprobe", "tsduck"]
