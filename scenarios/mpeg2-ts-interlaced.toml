id = "mpeg2-ts-interlaced"
engines = ["ffmpeg", "gstreamer", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/interlaced-352x288-mpeg2.ts"

# same interlaced mpeg-2 pictures carried in mpeg-ts instead of a program
# stream, so this isolates g2g's ts demux from its ps demux. shared libavcodec
# decode again, so bit-exact across all three engines.
[video]
width = 352
height = 288
format = "i420"
