# h265 remuxed into mp4 (g2g has no h265 encoder), chromium decodes hevc only in hardware so no player
id = "h265-mp4-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src-h265.mp4"

[produce]
container = "mp4"
video = "h265"
encode-video = false
audio = "aac"
validators = ["ffprobe", "mp4box"]
