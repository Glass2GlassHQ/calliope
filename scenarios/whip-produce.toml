# live WHIP publish through mediamtx, headless chromium reads it back over WHEP
id = "whip-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "whip"
video = "h264"
validators = ["player"]
