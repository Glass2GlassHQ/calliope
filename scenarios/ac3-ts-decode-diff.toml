id = "ac3-ts-decode-diff"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/tone-stereo-48k-ac3.ts"

# ffmpeg and g2g both decode ac3 through the same libavcodec, so the pcm is
# bit-exact and cross-compares. gstreamer stays out: it may plug a52dec, whose
# output differs. exercises g2g's mpeg-ts ac3 demux.
[audio]
codec = "ac3"
rate = 48000
channels = 2
