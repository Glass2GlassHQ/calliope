id = "yadif-deinterlace-diff"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 60
deinterlace = true

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/interlaced-352x288.h264"

# both engines insert their single-rate yadif between decode and dump; g2g's
# deinterlace implements the ffmpeg kernel, so the frames must stay bit-exact.
# exercises g2g's deinterlace element plus the interlace caps that tell it which
# field comes first. gstreamer stays out: its deinterlace emitted 52 frames for
# these 50 and diverged from frame 0 (verified 2026-08-06), so it does not share
# the kernel's boundary behavior.
[video]
width = 352
height = 288
format = "i420"
