id = "av1-mp4-decode"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/testsrc-128x128-av1.mp4"

# av01 sample-entry demux from mp4 into g2g's dav1d decode. av1 decode is
# normative (bit-exact by spec), so the frames cross-compare directly.
# gstreamer stays out: its av1 plugin availability varies by host.
[video]
width = 128
height = 128
format = "i420"
