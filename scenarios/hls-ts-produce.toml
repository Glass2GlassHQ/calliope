# hls with mpeg-ts segments, TSDuck checks each segment, hls.js plays the playlist
id = "hls-ts-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "hls-ts"
video = "h264"
audio = "aac"
validators = ["ffprobe", "tsduck", "mediastreamvalidator", "player"]
