id = "mpeg2-ps-interlaced"
engines = ["ffmpeg", "gstreamer", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/interlaced-352x288.mpg"

# dvd-style interlaced mpeg-2 in a program stream: exercises g2g's mpeg-ps demux
# and its per-picture pts synthesis (the container stamps pes packets, not
# pictures). every engine decodes through libavcodec, so the frames are
# bit-exact and the per-frame differential judges them directly.
[video]
width = 352
height = 288
format = "i420"
