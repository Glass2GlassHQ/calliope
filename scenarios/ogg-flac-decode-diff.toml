id = "ogg-flac-decode-diff"
engines = ["ffmpeg", "gstreamer", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/tone-mono-48k-flac.oga"

# same lossless flac payload carried in ogg, so this isolates g2g's ogg-flac
# demux (page/packet framing, in-band streaminfo) from the native flac path.
# still bit-exact on every engine.
[audio]
codec = "flac"
rate = 48000
channels = 1
