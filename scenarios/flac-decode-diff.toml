id = "flac-decode-diff"
engines = ["ffmpeg", "gstreamer", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/tone-mono-48k.flac"

# flac is lossless integer decode, so every engine must produce byte-identical
# pcm and the whole stream cross-compares. exercises g2g's native flac frame
# parse feeding its libavcodec decode.
[audio]
codec = "flac"
rate = 48000
channels = 1
