id = "vorbis-determinism"
engines = ["g2g"]
reference = "g2g"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/tone-mono-44k.ogg"

# g2g decodes vorbis via symphonia, which is not bit-exact against libvorbis, so
# there is nothing to cross-compare: repeat the decode and require byte-identical
# pcm. exercises the ogg-vorbis demux plus the pure-rust decoder.
[audio]
codec = "vorbis"
rate = 44100
channels = 1

[determinism]
runs = 3
