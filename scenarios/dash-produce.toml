# dash, ffmpeg only: g2g has no DASH packager, so this proves the dash validators until it has one
id = "dash-produce"
engines = ["ffmpeg"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "dash"
video = "h264"
audio = "aac"
validators = ["ffprobe", "dash-if", "player"]
