id = "opus-decode-diff"
engines = ["gstreamer", "g2g"]
reference = "gstreamer"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/tone-mono-48k.opus"

# gstreamer's opusdec and g2g's OpusDec both call libopus' integer s16 api, so
# the pcm is bit-exact and cross-compares. ffmpeg is out since n8.x: its libopus
# wrapper decodes float internally and quantizes itself, drifting +-1 lsb from
# the integer api on ~7% of samples (verified 2026-08-06, gst == g2g, ffmpeg
# the outlier in both s16 and float output).
[audio]
codec = "opus"
rate = 48000
channels = 1
