id = "h264-mkv-overlay-determinism"
engines = ["gstreamer", "g2g"]
reference = "g2g"
timeout-secs = 60

# demux ! decode ! convert ! textoverlay ! convert: the no-cue overlay is a
# strict RGBA-only element, so the demuxed placeholder caps refining
# mid-stream must renegotiate the whole sandwich (the g2g M959 class). The
# RGBA round-trip is not bit-exact across engines, so each engine
# self-compares; a failed run (g2g CapsMismatch) fails determinism outright.
overlay = true

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/testsrc-176x144.mkv"

[video]
width = 176
height = 144
format = "i420"

[determinism]
runs = 3
threads = true
