# hls with fmp4 segments behind an EXT-X-MAP init segment, hls.js plays the playlist
id = "hls-fmp4-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "hls-fmp4"
video = "h264"
audio = "aac"
validators = ["ffprobe", "mediastreamvalidator", "player"]
