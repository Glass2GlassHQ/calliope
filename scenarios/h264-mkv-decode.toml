id = "h264-mkv-decode"
engines = ["ffmpeg", "gstreamer", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/testsrc-176x144.mkv"

# matroska demux path: g2g has to convert the avcc-framed samples (and the
# out-of-band sps/pps) to annex-b before its parser sees them. shared
# libavcodec decode, so the frames are bit-exact.
[video]
width = 176
height = 144
format = "i420"
