# x264 + passed-through aac in progressive mp4, judged by ffprobe, MP4Box and a WebCodecs decode
id = "h264-mp4-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "mp4"
video = "h264"
audio = "aac"
validators = ["ffprobe", "mp4box", "player"]
