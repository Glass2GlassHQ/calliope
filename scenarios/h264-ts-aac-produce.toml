# x264 + aac in mpeg-ts, TSDuck checks continuity, sync, timestamps and the PCR interval
id = "h264-ts-aac-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 120

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "ts"
video = "h264"
audio = "aac"
validators = ["ffprobe", "tsduck"]
