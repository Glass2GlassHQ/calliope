id = "h264-interlaced"
engines = ["ffmpeg", "gstreamer", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/interlaced-352x288.h264"

# field-coded (top field first) h264: exercises the interlace flag plumbing
# through g2g's h264 parse and decode, where a progressive assumption shows up
# as wrong geometry or comb artifacts. shared libavcodec decode, so bit-exact.
[video]
width = 352
height = 288
format = "i420"
