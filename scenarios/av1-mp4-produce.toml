# av1 (g2g rav1e, ffmpeg svt-av1) + aac in mp4, rav1e takes about 40 s on the clip
id = "av1-mp4-produce"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 240

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/produce-src.mp4"

[produce]
container = "mp4"
video = "av1"
audio = "aac"
validators = ["ffprobe", "mp4box", "player"]
