id = "mp2-ts-decode-diff"
engines = ["ffmpeg", "g2g"]
reference = "ffmpeg"
timeout-secs = 60

[input]
# generated by tools/gen-local-corpus.sh
path = "../local-corpus/tone-stereo-48k-mp2.ts"

# same shared-libavcodec rationale as the ac3 case, so the decoded pcm is
# bit-exact between these two engines. exercises g2g's mpeg-ts mp2 demux.
[audio]
codec = "mp2"
rate = 48000
channels = 2
