# loopback only: the canary shares the host network with mediamtx
logLevel: warn
rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:18554
hls: true
hlsAddress: 127.0.0.1:18888
# g2g plays mpeg-ts hls, its fmp4 hls path fails caps negotiation
hlsVariant: mpegts
# keep the playlist ready, a restarted pipeline would otherwise wait for a fresh muxer
hlsAlwaysRemux: true
rtmp: false
webrtc: true
webrtcAddress: 127.0.0.1:18889
webrtcLocalUDPAddress: 127.0.0.1:18189
# offer only the loopback candidate, the udp socket is not bound on the other interfaces
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false
paths:
  baseline: {}
