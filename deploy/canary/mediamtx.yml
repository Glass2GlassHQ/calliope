# loopback only: the canary shares the host network with mediamtx
logLevel: warn
rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:18554
hls: true
hlsAddress: 127.0.0.1:18888
# the self-hosted hls rows cover mpeg-ts, the public rows fmp4
hlsVariant: mpegts
# muxers start on request, so the hevc, av1 and vp9 paths mpeg-ts hls cannot carry never start one
hlsAlwaysRemux: false
rtmp: true
rtmpAddress: 127.0.0.1:18935
webrtc: true
webrtcAddress: 127.0.0.1:18889
webrtcLocalUDPAddress: 127.0.0.1:18189
# offer only the loopback candidate, the udp socket is not bound on the other interfaces
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
# the listener g2g's srtsink calls into
srt: true
srtAddress: 127.0.0.1:18891
moq: false
api: false
metrics: false
pprof: false
playback: false
paths:
  baseline: {}
  hevc: {}
  av1: {}
  vp9-opus: {}
  h264-aac: {}
  switching: {}
  egress-rtmp: {}
  # relayed from the faulted mediamtx once g2g publishes there
  egress-faulted-rtsp: {}
  egress-faulted-whip: {}
  egress-faulted-srt: {}
