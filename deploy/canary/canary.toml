# relative to the working directory: /var/lib/canary in the container
log-dir = "canary-out/log"
status-dir = "canary-out/status"
sample-secs = 60
stall-secs = 30
# a recording row writes its files under <recordings-dir>/<id>, the canary deletes each one that passes its checks
recordings-dir = "canary-out/recordings"

# self-hosted: mediamtx and the feeder on the same host, a failure here is g2g's
# rows that decode a feeder clip end in `checksumsink name=video`, matched against its table

[[pipeline]]
id = "baseline-rtsp"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/baseline ! decodebin ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "baseline-hls"
tier = "self-hosted"
launch = "hlssrc location=http://127.0.0.1:18888/baseline/index.m3u8 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# the feeder is the srt and rist caller, g2g's srtsrc and ristsrc only listen
[[pipeline]]
id = "baseline-srt"
tier = "self-hosted"
launch = "srtsrc address=127.0.0.1 port=18890 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# ffmpeg's librist sends the simple profile, a non-g2g peer
[[pipeline]]
id = "baseline-rist"
tier = "self-hosted"
launch = "ristsrc address=127.0.0.1 port=18894 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "baseline-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/baseline/whep ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "hevc-rtsp"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/hevc ! h265parse ! avdec_h265 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/hevc.txt"

# mediamtx carries av1 and vp9 to a reader over webrtc and rtsp, and g2g's rtspsrc reads only h264 and h265
[[pipeline]]
id = "av1-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/av1/whep video-codec=av1 ! av1parse ! avdec_av1 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/av1.txt"

[[pipeline]]
id = "vp9-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/vp9-opus/whep video-codec=vp9 ! avdec_vp9 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/vp9.txt"

# audio only: the config takes no audio-sink without a video-sink
[[pipeline]]
id = "opus-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/vp9-opus/whep media=audio ! opusdec ! fakesink"

# audio and video decoded together: the audio sink turns on the a/v drift check
[[pipeline]]
id = "h264-aac-rtsp"
tier = "self-hosted"
launch = "uridecodebin uri=rtsp://127.0.0.1:18554/h264-aac name=d d.video_0 ! checksumsink name=video d.audio_0 ! checksumsink name=audio"
video-sink = "video"
audio-sink = "audio"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "h264-aac-hls"
tier = "self-hosted"
launch = "uridecodebin uri=http://127.0.0.1:18888/h264-aac/index.m3u8 name=d d.video_0 ! checksumsink name=video d.audio_0 ! checksumsink name=audio"
video-sink = "video"
audio-sink = "audio"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# the switching clip changes size and frame rate at an idr with a new sps, the decoder must follow both
[[pipeline]]
id = "switching-rtsp"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/switching ! decodebin ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/switching.txt"

# egress: g2g encodes and publishes into mediamtx over rtmp, a second row reads it back over rtsp
# videotestsrc runs ahead of real time, clocksync paces it
# a lossless encode of a moving bar that repeats every 80 frames, the readers match moving-bar.txt, the source's own frames

[[pipeline]]
id = "egress-rtmp-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=moving-bar ! video/x-raw,format=I420,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software pass=quant quantizer=0 ! h264parse ! flvmux ! rtmpsink location=rtmp://127.0.0.1:18935/egress-rtmp"

[[pipeline]]
id = "egress-rtmp-play"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-rtmp ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/moving-bar.txt"

# dash-if livesim2 in g2g-canary-livesim2 loops its testpic_2s asset as live cmaf with 64-bit media times
[[pipeline]]
id = "dash-livesim2"
tier = "self-hosted"
launch = "dashsrc location=http://127.0.0.1:18900/livesim2/testpic_2s/Manifest.mpd ! fmp4demux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# a new period every minute
[[pipeline]]
id = "dash-livesim2-multiperiod"
tier = "self-hosted"
launch = "dashsrc location=http://127.0.0.1:18900/livesim2/periods_60/testpic_2s/Manifest.mpd ! fmp4demux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# peers: g2g against the reference servers in g2g-canary-peers, live555, nginx-rtmp, libsrt's srt-live-transmit, janus
# and livekit

# live555ProxyServer re-serves the clean mediamtx baseline path
# live555 moves its rtp timestamps once when mediamtx's first sender report arrives, so a run that starts with the proxy can see one backward pts
[[pipeline]]
id = "peers-live555-rtsp"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18570/proxyStream ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# live555's rtsp client pulls g2g's rtspserversink, a second row reads it back through the proxy
[[pipeline]]
id = "peers-live555-serve"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! rtspserversink address=127.0.0.1 port=18571"

[[pipeline]]
id = "peers-live555-serve-play"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18572/proxyStream ! h264parse ! avdec_h264 ! checksumsink name=video"
note = "The live555 proxy shifts its RTP timestamps by a few ms when the first sender report from g2g's rtspserversink arrives. After every canary start this row sees one backward pts, which shows as a one-minute timestamps incident. It does not happen mid-run."
video-sink = "video"

# g2g's rtmpsink publishes into nginx-rtmp, which pushes the stream to g2g's rtmpsrc listener
[[pipeline]]
id = "peers-rtmp-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! flvmux ! rtmpsink location=rtmp://127.0.0.1:18936/egress/egress"

[[pipeline]]
id = "peers-rtmp-publish-play"
tier = "self-hosted"
launch = "rtmpsrc address=127.0.0.1 port=18937 ! flvdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# ffmpeg publishes the baseline clip into nginx-rtmp, which pushes it to g2g's rtmpsrc listener
[[pipeline]]
id = "peers-rtmp-push"
tier = "self-hosted"
launch = "rtmpsrc address=127.0.0.1 port=18938 ! flvdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# g2g's srtsink calls srt-live-transmit, which calls g2g's srtsrc listener
[[pipeline]]
id = "peers-srt-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! mpegtsmux ! srtsink host=127.0.0.1 port=18950"

[[pipeline]]
id = "peers-srt-play"
tier = "self-hosted"
launch = "srtsrc address=127.0.0.1 port=18951 keep-listening=true ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# janus and livekit: g2g publishes the moving bar and a second row reads it back through the server
# the publishers loop the 80 frames the image encodes once, so they decode nothing and encode nothing
# the readers match moving-bar.txt, the frames videotestsrc generated

[[pipeline]]
id = "peers-janus-publish"
tier = "self-hosted"
launch = "multifilesrc location=/usr/share/g2g-canary/clips/moving-bar/%02d.h264 loop=true framerate=30/1 ! h264parse ! clocksync ! janusvrsink janus-endpoint=ws://127.0.0.1:18960 room-id=1 feed-id=1"

[[pipeline]]
id = "peers-janus-play"
tier = "self-hosted"
launch = "janusvrsrc name=s janus-endpoint=ws://127.0.0.1:18960 room-id=1 feed-id=1 s. ! h264parse ! avdec_h264 ! checksumsink name=video s. ! fakesink"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/moving-bar.txt"

[[pipeline]]
id = "peers-livekit-publish"
tier = "self-hosted"
launch = "multifilesrc location=/usr/share/g2g-canary/clips/moving-bar/%02d.h264 loop=true framerate=30/1 ! h264parse ! clocksync ! livekitsink url=ws://127.0.0.1:18970 room=canary identity=publisher api-key=canary api-secret=g2g-canary-loopback-only-livekit-secret"

[[pipeline]]
id = "peers-livekit-play"
tier = "self-hosted"
launch = "livekitsrc name=s url=ws://127.0.0.1:18970 room=canary identity=reader api-key=canary api-secret=g2g-canary-loopback-only-livekit-secret s. ! h264parse ! avdec_h264 ! checksumsink name=video s. ! fakesink"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/moving-bar.txt"

# faulted: the baseline clip through g2g-canary-faulted, whose loopback follows fault-schedule.txt
# every row needs the content check, the recovery check is built on it

[[pipeline]]
id = "faulted-hls"
tier = "faulted"
launch = "hlssrc location=http://127.0.0.1:19888/faulted/index.m3u8 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "faulted-srt"
tier = "faulted"
launch = "srtsrc address=127.0.0.1 port=18892 keep-listening=true ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "faulted-rist"
tier = "faulted"
launch = "ristsrc address=127.0.0.1 port=18896 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# the same path over webrtc, mediamtx's udp port is inside the faults too
[[pipeline]]
id = "faulted-webrtc"
tier = "faulted"
launch = "whepsrc location=http://127.0.0.1:19889/faulted/whep reconnect=1000 reconnect-backoff-max=1000 ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# the same path through gst-rtsp-server, a second rtsp implementation
[[pipeline]]
id = "faulted-rtsp-gst"
tier = "faulted"
launch = "rtspsrc location=rtsp://127.0.0.1:19555/faulted stall-timeout=5000 reconnect=20 reconnect-backoff-max=1000 ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# audio and video, for the drift after each recovery
[[pipeline]]
id = "faulted-h264-aac-rtsp"
tier = "faulted"
launch = "rtspsrc name=s location=rtsp://127.0.0.1:19554/faulted-av stall-timeout=5000 reconnect=20 reconnect-backoff-max=1000 s. ! h264parse ! avdec_h264 ! checksumsink name=video s. ! aacparse ! avdec_aac ! checksumsink name=audio"
video-sink = "video"
audio-sink = "audio"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# files written across reconnects, each closed one checked
# splitmuxsink writes a new mp4 every recording-segment-secs, the canary fills in {recording-location} and {recording-max-size-time} for each run
[[pipeline]]
id = "faulted-rtsp-record"
tier = "faulted"
launch = "rtspsrc location=rtsp://127.0.0.1:19554/faulted stall-timeout=5000 reconnect=20 reconnect-backoff-max=1000 ! h264parse ! tee name=t ! splitmuxsink location={recording-location} max-size-time={recording-max-size-time} t. ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"
recording-segment-secs = 60

# egress through the faults: g2g publishes into the faulted mediamtx, which relays each path over its unfaulted rtmp
# port into the clean mediamtx, where a reader checks what arrived and records the publisher's recoveries

[[pipeline]]
id = "egress-faulted-rtsp-publish"
tier = "faulted"
launch = "videotestsrc pattern=moving-bar ! video/x-raw,format=I420,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software pass=quant quantizer=0 ! h264parse ! rtspclientsink location=rtsp://127.0.0.1:19554/egress-faulted-rtsp protocols=tcp reconnect=1000 reconnect-backoff-max=1000"
checked-by = "egress-faulted-rtsp-read"

[[pipeline]]
id = "egress-faulted-rtsp-read"
tier = "faulted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-faulted-rtsp stall-timeout=5000 reconnect=120 reconnect-backoff-max=1000 ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/moving-bar.txt"

[[pipeline]]
id = "egress-faulted-whip-publish"
tier = "faulted"
launch = "videotestsrc pattern=moving-bar ! video/x-raw,format=I420,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software pass=quant quantizer=0 ! h264parse ! whipsink location=http://127.0.0.1:19889/egress-faulted-whip/whip reconnect=1000 reconnect-backoff-max=1000"
checked-by = "egress-faulted-whip-read"

[[pipeline]]
id = "egress-faulted-whip-read"
tier = "faulted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-faulted-whip stall-timeout=5000 reconnect=120 reconnect-backoff-max=1000 ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/moving-bar.txt"

[[pipeline]]
id = "egress-faulted-srt-publish"
tier = "faulted"
launch = "videotestsrc pattern=moving-bar ! video/x-raw,format=I420,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software pass=quant quantizer=0 ! mpegtsmux ! srtsink host=127.0.0.1 port=19891 streamid=publish:egress-faulted-srt auto-reconnect=true"
checked-by = "egress-faulted-srt-read"

[[pipeline]]
id = "egress-faulted-srt-read"
tier = "faulted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-faulted-srt stall-timeout=5000 reconnect=120 reconnect-backoff-max=1000 ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/moving-bar.txt"

# three variants of one clip, a rate cap makes abr switch down and the clean window after it back up
[[pipeline]]
id = "faulted-abr-hls"
tier = "faulted"
launch = "hlssrc location=http://127.0.0.1:19890/master.m3u8 abr=true ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = ["/etc/canary/hashes/abr-720.txt", "/etc/canary/hashes/abr-360.txt", "/etc/canary/hashes/abr-180.txt"]

# public: third-party test streams with no uptime promise

[[pipeline]]
id = "unified-live-hls"
tier = "public"
launch = "hlssrc location=https://demo.unified-streaming.com/k8s/live/stable/live.isml/.m3u8 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# a public webcam in slovakia, h264 1280x720 over rtsp on port 1935
[[pipeline]]
id = "strba-rtsp"
tier = "public"
launch = "rtspsrc location=rtsp://stream.strba.sk:1935/strba/VYHLAD_JAZERO.stream reconnect=5 ! decodebin ! checksumsink name=video"
video-sink = "video"

# no public srt entry: g2g's srtsrc only listens, a public srt server never calls in

# no public livesim2 row: livesim2.dashif.org allows 10000 requests per ip per 24 hours, a live row spends that in about 3 hours

# ll-hls with fmp4 parts
[[pipeline]]
id = "mux-llhls"
tier = "public"
ends = true
note = "Mux ends this live stream at 03:20 and 15:20 UTC and starts a new one. A run that ends on the final playlist opens no incident. When that playlist does not arrive, the stream answers 412 until the next one starts, which shows as a short down incident at one of those times."
launch = "hlssrc location=https://stream.mux.com/v69RSHhFelSm4701snP22dYz2jICy4E4FUyk02rW4gxRM.m3u8 max-bandwidth=1000000 ! fmp4demux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# no public moq row: moq.dev's relay negotiates the ietf draft, but its broadcasts use the hang catalog and containers moqtsrc does not read

# vod streams loop: clocksync paces them to real time, the lowest variant keeps bandwidth down
[[pipeline]]
id = "apple-vod-hls"
tier = "public"
ends = true
launch = "hlssrc location=https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8 max-bandwidth=1000000 ! tsdemux ! clocksync ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# the same bipbop content as fmp4 segments
[[pipeline]]
id = "apple-fmp4-vod-hls"
tier = "public"
ends = true
launch = "hlssrc location=https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8 max-bandwidth=1000000 ! fmp4demux ! clocksync ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# self-hosted rows that build their graphs with the g2g rust api instead of a launch line, see g2g's examples/g2g-api-soak

# builds rtspsrc ! h264parse ! avdec_h264 ! checksumsink, stops it with a state change to null after 60 s, and builds it again
[[pipeline]]
id = "api-rebuild"
tier = "self-hosted"
program = "/usr/local/bin/g2g-api-soak"
launch = "rebuild"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# one graph that adds and removes a scaled tee branch, splices an identity after the decoder and sets h264parse's config-interval, every 12 s
[[pipeline]]
id = "api-mutate"
tier = "self-hosted"
program = "/usr/local/bin/g2g-api-soak"
launch = "mutate"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"
