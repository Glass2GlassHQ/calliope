# relative to the working directory: /var/lib/canary in the container
log-dir = "canary-out/log"
status-dir = "canary-out/status"
sample-secs = 60
stall-secs = 30

# self-hosted: mediamtx and the feeder on the same host, a failure here is g2g's
# rows that decode a feeder clip end in `checksumsink name=video`, matched against its table

[[pipeline]]
id = "baseline-rtsp"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/baseline ! decodebin ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "baseline-hls"
tier = "self-hosted"
launch = "hlssrc location=http://127.0.0.1:18888/baseline/index.m3u8 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# the feeder is the srt and rist caller, g2g's srtsrc and ristsrc only listen
[[pipeline]]
id = "baseline-srt"
tier = "self-hosted"
launch = "srtsrc address=127.0.0.1 port=18890 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# ffmpeg's librist sends the simple profile, a non-g2g peer
[[pipeline]]
id = "baseline-rist"
tier = "self-hosted"
launch = "ristsrc address=127.0.0.1 port=18894 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "baseline-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/baseline/whep ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "hevc-rtsp"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/hevc ! h265parse ! avdec_h265 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/hevc.txt"

# mediamtx carries av1 and vp9 to a reader over webrtc and rtsp, and g2g's rtspsrc reads only h264 and h265
[[pipeline]]
id = "av1-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/av1/whep video-codec=av1 ! av1parse ! avdec_av1 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/av1.txt"

[[pipeline]]
id = "vp9-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/vp9-opus/whep video-codec=vp9 ! avdec_vp9 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/vp9.txt"

[[pipeline]]
id = "opus-webrtc"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/vp9-opus/whep media=audio ! opusdec ! fakesink"

# audio and video decoded together: the audio sink turns on the a/v drift check
[[pipeline]]
id = "h264-aac-rtsp"
tier = "self-hosted"
launch = "uridecodebin uri=rtsp://127.0.0.1:18554/h264-aac name=d d.video_0 ! checksumsink name=video d.audio_0 ! checksumsink name=audio"
video-sink = "video"
audio-sink = "audio"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "h264-aac-hls"
tier = "self-hosted"
launch = "uridecodebin uri=http://127.0.0.1:18888/h264-aac/index.m3u8 name=d d.video_0 ! checksumsink name=video d.audio_0 ! checksumsink name=audio"
video-sink = "video"
audio-sink = "audio"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# egress: g2g encodes and publishes into mediamtx, a second row reads it back over rtsp
# videotestsrc runs ahead of real time, clocksync paces it

[[pipeline]]
id = "egress-rtmp-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! flvmux ! rtmpsink location=rtmp://127.0.0.1:18935/egress-rtmp"

[[pipeline]]
id = "egress-rtmp-play"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-rtmp ! h264parse ! avdec_h264 ! fakesink"

[[pipeline]]
id = "egress-whip-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! whipsink location=http://127.0.0.1:18889/egress-whip/whip"

[[pipeline]]
id = "egress-whip-play"
tier = "self-hosted"
launch = "whepsrc location=http://127.0.0.1:18889/egress-whip/whep ! h264parse ! avdec_h264 ! fakesink"

[[pipeline]]
id = "egress-srt-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! mpegtsmux ! srtsink host=127.0.0.1 port=18891 streamid=publish:egress-srt"

[[pipeline]]
id = "egress-srt-play"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-srt ! h264parse ! avdec_h264 ! fakesink"

# g2g serves rtsp and mediamtx pulls it as the egress-rtsp path's source
[[pipeline]]
id = "egress-rtsp-serve"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! rtspserversink address=127.0.0.1 port=18560"

[[pipeline]]
id = "egress-rtsp-play"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-rtsp ! h264parse ! avdec_h264 ! fakesink"

[[pipeline]]
id = "egress-rtsp-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! rtspclientsink location=rtsp://127.0.0.1:18554/egress-rtsp-publish protocols=tcp"

[[pipeline]]
id = "egress-rtsp-publish-play"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18554/egress-rtsp-publish ! h264parse ! avdec_h264 ! fakesink"

# dash-if livesim2 in g2g-canary-livesim2 loops its testpic_2s asset as live cmaf with 64-bit media times
[[pipeline]]
id = "dash-livesim2"
tier = "self-hosted"
launch = "dashsrc location=http://127.0.0.1:18900/livesim2/testpic_2s/Manifest.mpd ! fmp4demux ! h264parse ! avdec_h264 ! fakesink"

# a new period every minute
[[pipeline]]
id = "dash-livesim2-multiperiod"
tier = "self-hosted"
launch = "dashsrc location=http://127.0.0.1:18900/livesim2/periods_60/testpic_2s/Manifest.mpd ! fmp4demux ! h264parse ! avdec_h264 ! fakesink"

# peers: g2g against the reference servers in g2g-canary-peers, live555, nginx-rtmp and libsrt's srt-live-transmit

# live555ProxyServer re-serves the clean mediamtx baseline path
# live555 moves its rtp timestamps once when mediamtx's first sender report arrives, so a run that starts with the proxy can see one backward pts
[[pipeline]]
id = "peers-live555-rtsp"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18570/proxyStream ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# live555's rtsp client pulls g2g's rtspserversink, a second row reads it back through the proxy
# live555 moves its rtp timestamps by a few ms at g2g's first sender report after both start, so that first run can see one backward pts
[[pipeline]]
id = "peers-live555-serve"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! rtspserversink address=127.0.0.1 port=18571"

[[pipeline]]
id = "peers-live555-serve-play"
tier = "self-hosted"
launch = "rtspsrc location=rtsp://127.0.0.1:18572/proxyStream ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# g2g's rtmpsink publishes into nginx-rtmp, which pushes the stream to g2g's rtmpsrc listener
[[pipeline]]
id = "peers-rtmp-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! h264parse ! flvmux ! rtmpsink location=rtmp://127.0.0.1:18936/egress/egress"

[[pipeline]]
id = "peers-rtmp-publish-play"
tier = "self-hosted"
launch = "rtmpsrc address=127.0.0.1 port=18937 ! flvdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# ffmpeg publishes the baseline clip into nginx-rtmp, which pushes it to g2g's rtmpsrc listener
[[pipeline]]
id = "peers-rtmp-push"
tier = "self-hosted"
launch = "rtmpsrc address=127.0.0.1 port=18938 ! flvdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# g2g's srtsink calls srt-live-transmit, which calls g2g's srtsrc listener
[[pipeline]]
id = "peers-srt-publish"
tier = "self-hosted"
launch = "videotestsrc pattern=ball ! video/x-raw,width=320,height=240,framerate=30/1 ! clocksync ! x264enc backend=software bitrate=300000 ! mpegtsmux ! srtsink host=127.0.0.1 port=18950"

[[pipeline]]
id = "peers-srt-play"
tier = "self-hosted"
launch = "srtsrc address=127.0.0.1 port=18951 keep-listening=true ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"

# faulted: the baseline clip through g2g-canary-faulted, whose loopback follows fault-schedule.txt
# every row needs the content check, the recovery check is built on it

[[pipeline]]
id = "faulted-rtsp"
tier = "faulted"
launch = "rtspsrc location=rtsp://127.0.0.1:19554/faulted stall-timeout=5000 reconnect=20 reconnect-backoff-max=1000 ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "faulted-hls"
tier = "faulted"
launch = "hlssrc location=http://127.0.0.1:19888/faulted/index.m3u8 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "faulted-srt"
tier = "faulted"
launch = "srtsrc address=127.0.0.1 port=18892 keep-listening=true ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

[[pipeline]]
id = "faulted-rist"
tier = "faulted"
launch = "ristsrc address=127.0.0.1 port=18896 ! tsdemux ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# the same path through gst-rtsp-server, a second rtsp implementation
[[pipeline]]
id = "faulted-rtsp-gst"
tier = "faulted"
launch = "rtspsrc location=rtsp://127.0.0.1:19555/faulted stall-timeout=5000 reconnect=20 reconnect-backoff-max=1000 ! h264parse ! avdec_h264 ! checksumsink name=video"
video-sink = "video"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# audio and video, for the drift after each recovery
[[pipeline]]
id = "faulted-h264-aac-rtsp"
tier = "faulted"
launch = "rtspsrc name=s location=rtsp://127.0.0.1:19554/faulted-av stall-timeout=5000 reconnect=20 reconnect-backoff-max=1000 s. ! h264parse ! avdec_h264 ! checksumsink name=video s. ! aacparse ! avdec_aac ! checksumsink name=audio"
video-sink = "video"
audio-sink = "audio"
expect-hashes = "/etc/canary/hashes/baseline.txt"

# public: third-party test streams with no uptime promise

[[pipeline]]
id = "unified-live-hls"
tier = "public"
launch = "hlssrc location=https://demo.unified-streaming.com/k8s/live/stable/live.isml/.m3u8 ! tsdemux ! h264parse ! avdec_h264 ! fakesink"

# a public webcam in slovakia, h264 1280x720 over rtsp on port 1935
[[pipeline]]
id = "strba-rtsp"
tier = "public"
launch = "rtspsrc location=rtsp://stream.strba.sk:1935/strba/VYHLAD_JAZERO.stream reconnect=5 ! decodebin ! fakesink"

# no public srt entry: g2g's srtsrc only listens, a public srt server never calls in

# no public livesim2 row: livesim2.dashif.org allows 10000 requests per ip per 24 hours, a live row spends that in about 3 hours

# ll-hls with fmp4 parts
[[pipeline]]
id = "mux-llhls"
tier = "public"
ends = true
note = "Mux ends this live stream at 03:20 and 15:20 UTC and starts a new one. A run that ends on the final playlist opens no incident. When that playlist does not arrive, the stream answers 412 until the next one starts, which shows as a short down incident at one of those times."
launch = "hlssrc location=https://stream.mux.com/v69RSHhFelSm4701snP22dYz2jICy4E4FUyk02rW4gxRM.m3u8 max-bandwidth=1000000 ! fmp4demux ! h264parse ! avdec_h264 ! fakesink"

# no public moq row: moq.dev's relay negotiates the ietf draft, but its broadcasts use the hang catalog and containers moqtsrc does not read

# vod streams loop: clocksync paces them to real time, the lowest variant keeps bandwidth down
[[pipeline]]
id = "mux-vod-hls"
tier = "public"
ends = true
launch = "hlssrc location=https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8 max-bandwidth=1000000 ! tsdemux ! clocksync ! h264parse ! avdec_h264 ! fakesink"

[[pipeline]]
id = "apple-vod-hls"
tier = "public"
ends = true
launch = "hlssrc location=https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8 max-bandwidth=1000000 ! tsdemux ! clocksync ! h264parse ! avdec_h264 ! fakesink"

# the same bipbop content as fmp4 segments
[[pipeline]]
id = "apple-fmp4-vod-hls"
tier = "public"
ends = true
launch = "hlssrc location=https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8 max-bandwidth=1000000 ! fmp4demux ! clocksync ! h264parse ! avdec_h264 ! fakesink"
