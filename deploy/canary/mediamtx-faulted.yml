# the faulted container's own network namespace, the readers reach it through published loopback ports
# pasta hands a published connection over on the container's address, so these bind every address
logLevel: warn
rtsp: true
rtspTransports: [tcp]
rtspAddress: :19554
hls: true
hlsAddress: :19888
hlsVariant: mpegts
hlsAlwaysRemux: true
rtmp: true
rtmpAddress: :19935
# g2g's whipsink and srtsink publish into these through the faults
webrtc: true
webrtcAddress: :19889
webrtcLocalUDPAddress: :19189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
srt: true
srtAddress: :19891
moq: false
api: false
metrics: false
pprof: false
playback: false
paths:
  faulted: {}
  faulted-av: {}
  # copied over the unfaulted rtmp port into the clean mediamtx, where the faulted egress readers read it
  "~^egress-faulted-":
    runOnAvailable: ffmpeg -hide_banner -loglevel warning -i rtmp://127.0.0.1:19935/$MTX_PATH -c copy -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:18554/$MTX_PATH
    runOnAvailableRestart: true
