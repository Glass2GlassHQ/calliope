load_module /usr/lib64/nginx/modules/ngx_rtmp_module.so;
daemon off;
error_log stderr warn;
pid /tmp/nginx-peers.pid;

events {}

rtmp {
    access_log off;
    server {
        listen 18936;
        # g2g's rtmpsink publishes here, g2g's rtmpsrc listens for the push
        application egress {
            live on;
            push rtmp://127.0.0.1:18937/egress/egress;
        }
        # ffmpeg in canary-peers.sh publishes the baseline clip here
        application baseline {
            live on;
            push rtmp://127.0.0.1:18938/baseline/baseline;
        }
    }
}
